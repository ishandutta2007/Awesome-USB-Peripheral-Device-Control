<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseData {
      0% { stroke-dashoffset: 240; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes nodeBlink {
      0%, 100% { r: 3; fill-opacity: 0.3; }
      50% { r: 5; fill-opacity: 0.9; }
    }

    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .data-stream {
      stroke-dasharray: 20, 40;
      animation: pulseData 6s linear infinite;
    }

    .stream-fast {
      stroke-dasharray: 15, 30;
      animation: pulseData 3.5s linear infinite;
    }

    .radar-beam {
      transform-origin: 1040px 180px;
      animation: radarScan 8s linear infinite;
    }

    .pulsing-node-1 { animation: nodeBlink 2.5s ease-in-out infinite; }
    .pulsing-node-2 { animation: nodeBlink 3s ease-in-out infinite 0.8s; }
    .pulsing-node-3 { animation: nodeBlink 2.2s ease-in-out infinite 1.4s; }
    .floating-card { animation: waveFloat 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#cyberGrid)"/>

  <!-- Dynamic Ambient Cyber Circles (Background) -->
  <circle cx="1040" cy="180" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>
  <circle cx="1040" cy="180" r="100" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="1040" cy="180" r="60" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Dynamic Radar Scanner -->
  <g class="radar-beam" opacity="0.4">
    <path d="M 1040 180 L 1180 180 A 140 140 0 0 0 1140 85 Z" fill="url(#cyanGlow)" />
  </g>

  <!-- Animated Circuit & Data Lines -->
  <path d="M 0 100 L 220 100 L 270 150 L 500 150" fill="none" stroke="#0284c7" stroke-width="2" class="data-stream" opacity="0.5"/>
  <path d="M 100 360 L 250 210 L 480 210" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-fast" opacity="0.4"/>
  <path d="M 850 60 L 960 60 L 1000 100 L 1040 100" fill="none" stroke="#06b6d4" stroke-width="1.5" class="data-stream" opacity="0.6"/>
  <path d="M 800 300 L 920 300 L 980 240 L 1040 240" fill="none" stroke="#a855f7" stroke-width="1.5" class="stream-fast" opacity="0.5"/>

  <!-- Pulsing Bus Nodes -->
  <circle cx="270" cy="150" r="4" fill="#38bdf8" class="pulsing-node-1" filter="url(#subtleGlow)"/>
  <circle cx="250" cy="210" r="4" fill="#818cf8" class="pulsing-node-2" filter="url(#subtleGlow)"/>
  <circle cx="1000" cy="100" r="4" fill="#06b6d4" class="pulsing-node-3" filter="url(#subtleGlow)"/>
  <circle cx="980" cy="240" r="4" fill="#c084fc" class="pulsing-node-1" filter="url(#subtleGlow)"/>

  <!-- Peripheral Shield Icon Graphic on Right Side -->
  <g transform="translate(1005, 145)" filter="url(#subtleGlow)">
    <!-- USB Trident Symbol Vector -->
    <path d="M35 15 L35 48 M35 48 L22 36 M35 48 L48 36" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="12" r="4" fill="#38bdf8"/>
    <rect x="19" y="31" width="6" height="6" fill="#38bdf8"/>
    <polygon points="48,30 52,37 44,37" fill="#38bdf8"/>
    <!-- Lock / Security Ring -->
    <circle cx="35" cy="56" r="3" fill="#a855f7"/>
  </g>

  <!-- Floating Info Cards in Top Right / Middle (Subtle) -->
  <g class="floating-card" opacity="0.85">
    <rect x="740" y="45" width="180" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="758" cy="64" r="5" fill="#10b981"/>
    <text x="772" y="68" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">ALLOWLIST ACTIVE</text>

    <rect x="780" y="275" width="195" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="798" cy="294" r="5" fill="#ef4444"/>
    <text x="812" y="298" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">UNAUTHORIZED BLOCKED</text>
  </g>

  <!-- Foreground Title and Text (Protected & Crisp) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 60)">
      <rect width="270" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.2">🛡️ ZERO-TRUST ENDPOINT SECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#subtleGlow)">
      Awesome USB &amp; Peripheral Control
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#e2e8f0" font-size="18" font-weight="500">
      Enterprise Device Management, Port Whitelisting &amp; Hardware DLP
    </text>

    <!-- Feature Description / Tags -->
    <g transform="translate(0, 240)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="19" fill="#94a3b8" font-size="12.5" font-weight="500">🔒 Port Blocking</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="156" y="19" fill="#94a3b8" font-size="12.5" font-weight="500">💾 USB Encryption</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="313" y="19" fill="#94a3b8" font-size="12.5" font-weight="500">📋 Default-Deny</text>

      <!-- Tag 4 -->
      <rect x="456" y="0" width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="472" y="19" fill="#94a3b8" font-size="12.5" font-weight="500">⚡ BadUSB Defense</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="100%" height="4" fill="url(#textGrad)"/>
</svg>